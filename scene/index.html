<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>3D-сцена цифрового двійника електроскутера</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font: 14px system-ui, sans-serif;
    }
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 8px 12px;
      background: #ffffffdd;
      border-radius: 6px;
      z-index: 1;
    }
    #hud td { padding: 2px 6px; }
    .stale { color: #c62828; }
    #stats { margin-top: 6px; color: #555; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/",
      "3d-tiles-renderer/three": "./node_modules/3d-tiles-renderer/build/index.three.js",
      "3d-tiles-renderer/three/plugins": "./node_modules/3d-tiles-renderer/build/index.three-plugins.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <b id="thing">Електроскутер</b> · ревізія
    <span id="rev">—</span> · давність
    <span id="age">—</span> · прив'язано
    <span id="bound">—</span>
    <table id="vals"></table>
    <div id="stats"></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
